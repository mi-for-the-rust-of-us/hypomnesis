name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only workflow token: nothing in this workflow writes to the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Cross-platform matrix: hypomnesis has Windows-only `dxgi`/`pdh`,
    # macOS-only `metal`, and cross-platform `nvml` /
    # `nvidia-smi-fallback` paths; all three OSes must build clean on
    # MSRV (1.88) and stable.
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.88", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (v1)
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      # README documents two non-default configurations (bare RSS-only,
      # and a library-only set with no `clap`/`ctrlc`); check both here
      # so they can't silently drift from what's advertised.
      - name: Check (no default features)
        run: cargo check --locked --no-default-features

      - name: Check (library-only feature set)
        run: cargo check --locked --no-default-features --features nvml,dxgi,pdh

      - name: Clippy (defaults)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-features

  doc:
    # Separate doc-check job: catches broken intra-doc links early
    # (publish.yml also runs this, but waiting until release is too late).
    # A link can resolve under one feature set or target and not another
    # (a `use` that only some features compile), so the docs are built for
    # the three targets docs.rs builds, each with every feature and with
    # none. Cross-documenting needs only the target's standard library, so
    # every leg runs on Ubuntu, as docs.rs does.
    name: Doc check (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-apple-darwin]
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (v1)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # One cache per leg: the legs share the runner OS and the toolchain,
      # which is all the automatic key tells apart.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}${{ matrix.features }}

      - name: Doc check
        run: cargo doc --locked --no-deps --target ${{ matrix.target }} ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Dependency supply chain, per `deny.toml`. Build scripts and
  # proc-macros run arbitrary code at build time, so a compromised or yanked
  # dependency is worth failing the build over.
  deny:
    name: "Dependencies (cargo-deny)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
